---
- name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Read {{ upgrade_role_label }} version"
  ansible.builtin.raw: ssh_netscaler_adc show ns version
  delegate_to: "{{ upgrade_target }}"
  register: node_version_before_raw
  changed_when: false

- name: Parse current version
  ansible.builtin.set_fact:
    node_version_before_matches: >-
      {{ node_version_before_raw.stdout | default('')
         | regex_findall('(?im)NS([0-9]+(?:[.][0-9]+)*): Build ([0-9]+(?:[.][0-9]+)*)') }}

- name: Require a readable current version
  ansible.builtin.assert:
    that:
      - node_version_before_matches | length > 0
    fail_msg: >-
      Could not parse the running version reported by {{ upgrade_role_label }}.
      No install or reboot was attempted.

- name: Set current version and controller evidence paths
  ansible.builtin.set_fact:
    node_version_before: "{{ node_version_before_matches[0][0] ~ '-' ~ node_version_before_matches[0][1] }}"
    node_install_evidence: >-
      {{ report_directory }}/upgrade-{{ hostvars['localhost'].upgrade_run_id }}-{{ upgrade_target }}-installns.txt
    node_postboot_evidence: >-
      {{ report_directory }}/upgrade-{{ hostvars['localhost'].upgrade_run_id }}-{{ upgrade_target }}-postboot.txt

- name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Show {{ upgrade_role_label }} plan"
  ansible.builtin.debug:
    msg: >-
      {{ upgrade_role_label }} {{ hostvars[upgrade_target].nsip }} is
      {{ node_version_before }}; target is {{ netscaler_target_version }}.
      {{ 'Upgrade required.' if node_version_before != netscaler_target_version
         else 'Already at target; install and reboot will be skipped.' }}

- name: Install and reboot node when it is not already at target
  when: node_version_before != netscaler_target_version
  block:
    - name: Check whether installns already staged the target
      vars:
        boot_kernel_needle: 'kernel="/ns-{{ netscaler_target_version }}'
      ansible.builtin.raw: >-
        if test -f /var/nsinstall/installns_state
        && grep -Fqx {{ ('VERSION ns-' ~ netscaler_target_version ~ '.gz') | quote }}
        /var/nsinstall/installns_state
        && grep -q '^END_TIME ' /var/nsinstall/installns_state
        && grep -Fq {{ boot_kernel_needle | quote }}
        /flash/boot/loader.conf 2>/dev/null;
        then echo TARGET_ALREADY_STAGED;
        else echo INSTALLNS_REQUIRED; fi
      delegate_to: "{{ upgrade_target }}"
      register: node_stage_before
      changed_when: false
      failed_when: false

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Run official installns synchronously"
      ansible.builtin.raw: >-
        cd {{ (prepared_firmware_remote_installns | dirname) | quote }}
        && ./installns -Y -n
      delegate_to: "{{ upgrade_target }}"
      register: node_install_result
      changed_when: true
      when: "'TARGET_ALREADY_STAGED' not in (node_stage_before.stdout | default(''))"

    - name: Require installns success
      ansible.builtin.assert:
        that:
          - node_install_result.rc | default(0) == 0
        fail_msg: >-
          The official installns command failed on {{ upgrade_role_label }}
          with rc={{ node_install_result.rc | default('unknown') }}.
          No reboot will be requested.
      when: "'TARGET_ALREADY_STAGED' not in (node_stage_before.stdout | default(''))"

    - name: Confirm target is staged before reboot
      vars:
        boot_kernel_needle: 'kernel="/ns-{{ netscaler_target_version }}'
      ansible.builtin.raw: >-
        if test -f /var/nsinstall/installns_state
        && grep -Fqx {{ ('VERSION ns-' ~ netscaler_target_version ~ '.gz') | quote }}
        /var/nsinstall/installns_state
        && grep -q '^END_TIME ' /var/nsinstall/installns_state
        && grep -Fq {{ boot_kernel_needle | quote }}
        /flash/boot/loader.conf 2>/dev/null;
        then echo TARGET_STAGED_OK;
        else echo TARGET_STAGED_MISSING; fi
      delegate_to: "{{ upgrade_target }}"
      register: node_stage_after
      changed_when: false
      failed_when: false

    - name: Stop before reboot if target staging is incomplete
      ansible.builtin.assert:
        that:
          - "'TARGET_STAGED_OK' in (node_stage_after.stdout | default(''))"
        fail_msg: >-
          installns did not stage a complete {{ netscaler_target_version }}
          boot target on {{ upgrade_role_label }}. No reboot will be requested.

    - name: Preserve installns result on the Ansible controller
      ansible.builtin.copy:
        dest: "{{ node_install_evidence }}"
        mode: "0600"
        content: |
          Run ID: {{ hostvars['localhost'].upgrade_run_id }}
          Pair: {{ pair_name }}
          Role: {{ upgrade_role_label }}
          Host: {{ upgrade_target }} ({{ hostvars[upgrade_target].nsip }})
          Version before: {{ node_version_before }}
          Target version: {{ netscaler_target_version }}
          Previously staged: {{ 'TARGET_ALREADY_STAGED' in (node_stage_before.stdout | default('')) }}
          installns rc: {{ node_install_result.rc | default('not run') }}

          === INSTALLNS STDOUT ===
          {{ node_install_result.stdout | default('installns was already staged') }}

          === INSTALLNS STDERR ===
          {{ node_install_result.stderr | default('') }}

          === STAGING VALIDATION ===
          {{ node_stage_after.stdout | default('') }}
      delegate_to: localhost
      changed_when: true

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Request one reboot of {{ upgrade_role_label }}"
      ansible.builtin.uri:
        url: "{{ netscaler_management_protocol }}://{{ hostvars[upgrade_target].nsip }}/nitro/v1/config/reboot"
        method: POST
        status_code: [200, 201, -1]
        body_format: json
        body:
          reboot:
            warm: false
        headers:
          Content-Type: application/json
          X-NITRO-USER: "{{ nitro_user }}"
          X-NITRO-PASS: "{{ nitro_pass }}"
        validate_certs: "{{ netscaler_validate_certs }}"
        timeout: "{{ reboot_request_timeout }}"
      delegate_to: localhost
      register: node_reboot_request
      failed_when: false
      no_log: true

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Confirm reboot started"
      ansible.builtin.wait_for:
        host: "{{ hostvars[upgrade_target].nsip }}"
        port: "{{ netscaler_ssh_port }}"
        state: stopped
        connect_timeout: 3
        timeout: "{{ [reboot_down_timeout | int, 300] | max }}"
      delegate_to: localhost
      register: node_reboot_down
      changed_when: false
      failed_when: false

    - name: Stop safely if reboot did not start
      ansible.builtin.assert:
        that:
          - not (node_reboot_down.failed | default(false))
        fail_msg: >-
          SSH did not stop after the reboot request. No second reboot was sent.
          Inspect {{ upgrade_role_label }} manually.

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Wait for SSH after reboot"
      ansible.builtin.wait_for:
        host: "{{ hostvars[upgrade_target].nsip }}"
        port: "{{ netscaler_ssh_port }}"
        state: started
        delay: "{{ reboot_ssh_initial_delay }}"
        sleep: "{{ reboot_poll_interval }}"
        connect_timeout: 3
        timeout: "{{ [reboot_up_timeout | int, 1200] | max }}"
      delegate_to: localhost
      changed_when: false

    - name: Allow NetScaler services to stabilize
      ansible.builtin.wait_for:
        host: "{{ hostvars[upgrade_target].nsip }}"
        port: "{{ netscaler_ssh_port }}"
        state: started
        delay: "{{ post_reboot_stabilization_seconds | default(180) | int }}"
        connect_timeout: 3
        timeout: "{{ (post_reboot_stabilization_seconds | default(180) | int) + 60 }}"
      delegate_to: localhost
      changed_when: false

- name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Read final {{ upgrade_role_label }} version"
  ansible.builtin.raw: ssh_netscaler_adc show ns version
  delegate_to: "{{ upgrade_target }}"
  register: node_version_after_raw
  until:
    - not (node_version_after_raw.unreachable | default(false))
    - node_version_after_raw.rc | default(1) == 0
    - (node_version_after_raw.stdout | default('')) is search('(?im)NS[0-9]+(?:[.][0-9]+)*: Build [0-9]+(?:[.][0-9]+)*')
  retries: >-
    {{ (([post_reboot_cli_timeout | int, 600] | max) / (reboot_poll_interval | int)) | round(0, 'ceil') | int }}
  delay: "{{ reboot_poll_interval | int }}"
  changed_when: false
  ignore_unreachable: true

- name: Parse final version
  ansible.builtin.set_fact:
    node_version_after_matches: >-
      {{ node_version_after_raw.stdout | default('')
         | regex_findall('(?im)NS([0-9]+(?:[.][0-9]+)*): Build ([0-9]+(?:[.][0-9]+)*)') }}

- name: Require a readable final version
  ansible.builtin.assert:
    that:
      - node_version_after_matches | length > 0
    fail_msg: >-
      {{ upgrade_role_label }} did not return an authenticated CLI version after
      the reboot. The other node in the pair will not be upgraded.

- name: Set and validate final version
  ansible.builtin.set_fact:
    node_version_after: "{{ node_version_after_matches[0][0] ~ '-' ~ node_version_after_matches[0][1] }}"

- name: Preserve post-reboot result on the Ansible controller
  ansible.builtin.copy:
    dest: "{{ node_postboot_evidence }}"
    mode: "0600"
    content: |
      Run ID: {{ hostvars['localhost'].upgrade_run_id }}
      Pair: {{ pair_name }}
      Role: {{ upgrade_role_label }}
      Host: {{ upgrade_target }} ({{ hostvars[upgrade_target].nsip }})
      Expected version: {{ netscaler_target_version }}
      Observed version: {{ node_version_after }}
  delegate_to: localhost
  changed_when: true
  when: node_version_before != netscaler_target_version

- name: Record node versions in the pair report
  ansible.builtin.set_fact:
    pair_versions: >-
      {{ pair_versions | combine({upgrade_slot: {
           'before': node_version_before,
           'after': node_version_after,
           'changed': node_version_before != node_version_after
         }}) }}

- name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Validate {{ upgrade_role_label }} version"
  ansible.builtin.assert:
    that:
      - node_version_after == netscaler_target_version
    success_msg: "{{ upgrade_role_label }} is running {{ node_version_after }}."
    fail_msg: >-
      {{ upgrade_role_label }} version validation failed: expected
      {{ netscaler_target_version }}, got {{ node_version_after }}.
