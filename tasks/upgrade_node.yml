---
- name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Read {{ upgrade_role_label }} version"
  ansible.builtin.raw: ssh_netscaler_adc show ns version
  delegate_to: "{{ upgrade_target }}"
  register: node_version_before_raw
  changed_when: false

- name: Find current version in complete command output
  ansible.builtin.set_fact:
    node_version_before_matches: >-
      {{ node_version_before_raw.stdout | default('')
         | regex_findall('(?im)NS([0-9]+(?:[.][0-9]+)*): Build ([0-9]+(?:[.][0-9]+)*)') }}

- name: Validate current version output
  ansible.builtin.assert:
    that: [node_version_before_matches | length > 0]
    fail_msg: >-
      Could not parse the running version reported by {{ upgrade_role_label }}.
      No disruptive action was taken.

- name: Set current version
  ansible.builtin.set_fact:
    node_version_before: "{{ node_version_before_matches[0][0] ~ '-' ~ node_version_before_matches[0][1] }}"

- name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Show {{ upgrade_role_label }} plan"
  ansible.builtin.debug:
    msg: >-
      {{ upgrade_role_label }} {{ hostvars[upgrade_target].nsip }} is {{ node_version_before }};
      target is {{ netscaler_target_version }}.
      {{ 'Upgrade required.' if node_version_before != netscaler_target_version else 'Already at target; disruptive steps will be skipped.' }}

- name: Upgrade node when it is not already at target
  when: node_version_before != netscaler_target_version
  block:
    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Verify preparation marker"
      ansible.builtin.raw: >-
        if test -f {{ prepared_firmware_remote_marker | quote }};
        then echo PREP_MARKER_OK; else echo PREP_MARKER_MISSING; fi
      delegate_to: "{{ upgrade_target }}"
      register: node_preparation_marker
      changed_when: false
      failed_when: false

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Recheck prepared archive SHA-256"
      ansible.builtin.raw: >-
        sha256 -q {{ prepared_firmware_remote_archive | quote }}
      delegate_to: "{{ upgrade_target }}"
      register: node_prepared_archive
      changed_when: false
      failed_when: false

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Verify prepared installns"
      ansible.builtin.raw: >-
        if test -f {{ prepared_firmware_remote_installns | quote }};
        then echo INSTALLNS_FILE_OK; else echo INSTALLNS_FILE_MISSING; fi
      delegate_to: "{{ upgrade_target }}"
      register: node_prepared_installns
      changed_when: false
      failed_when: false

    - name: Confirm this node passed the preparation stage
      ansible.builtin.assert:
        that:
          - "'PREP_MARKER_OK' in (node_preparation_marker.stdout | default(''))"
          - prepared_firmware_sha256 in (node_prepared_archive.stdout | default(''))
          - "'INSTALLNS_FILE_OK' in (node_prepared_installns.stdout | default(''))"
        fail_msg: >-
          The verified preparation marker, archive checksum, or installns is
          invalid on {{ upgrade_role_label }}. Run upgrade_prep.yaml again.
      delegate_to: localhost

    - name: Set backup and persistent installns tracking paths
      ansible.builtin.set_fact:
        node_backup_name: >-
          ansible_pre_{{ node_version_before | regex_replace('[^A-Za-z0-9_.-]', '_') }}_to_{{ netscaler_target_version | regex_replace('[^A-Za-z0-9_.-]', '_') }}
        node_install_log: >-
          {{ prepared_firmware_remote_installns | dirname }}/.ansible-installns-{{ netscaler_target_version | regex_replace('[^A-Za-z0-9_.-]', '_') }}.log
        node_install_rc: >-
          {{ prepared_firmware_remote_installns | dirname }}/.ansible-installns-{{ netscaler_target_version | regex_replace('[^A-Za-z0-9_.-]', '_') }}.rc
        node_install_pid: >-
          {{ prepared_firmware_remote_installns | dirname }}/.ansible-installns-{{ netscaler_target_version | regex_replace('[^A-Za-z0-9_.-]', '_') }}.pid
        node_install_evidence: >-
          {{ report_directory }}/upgrade-{{ hostvars['localhost'].upgrade_run_id }}-{{ upgrade_target }}-installns.txt
        node_postboot_evidence: >-
          {{ report_directory }}/upgrade-{{ hostvars['localhost'].upgrade_run_id }}-{{ upgrade_target }}-postboot.txt

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Check pre-upgrade backup"
      ansible.builtin.raw: ssh_netscaler_adc show system backup
      delegate_to: "{{ upgrade_target }}"
      register: node_backup_before
      changed_when: false
      when: create_pre_upgrade_backup | bool

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Create full pre-upgrade backup"
      ansible.builtin.raw: >-
        ssh_netscaler_adc create system backup {{ node_backup_name }} -level full
      delegate_to: "{{ upgrade_target }}"
      changed_when: true
      when:
        - create_pre_upgrade_backup | bool
        - node_backup_name not in (node_backup_before.stdout | default(''))

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Verify pre-upgrade backup"
      ansible.builtin.raw: ssh_netscaler_adc show system backup
      delegate_to: "{{ upgrade_target }}"
      register: node_backup_after
      until:
        - node_backup_after.rc | default(1) == 0
        - node_backup_name in (node_backup_after.stdout | default(''))
      retries: 12
      delay: 5
      changed_when: false
      when: create_pre_upgrade_backup | bool

    - name: Confirm the pre-upgrade backup exists
      ansible.builtin.assert:
        that: [node_backup_name in (node_backup_after.stdout | default(''))]
        fail_msg: >-
          Full backup {{ node_backup_name }} was not confirmed on {{ upgrade_role_label }}.
          installns was not started.
      when: create_pre_upgrade_backup | bool

    - name: Inspect staged target version without remote Python
      ansible.builtin.raw: >-
        if test -f /var/nsinstall/installns_state
        && grep -Fqx {{ ('VERSION ns-' ~ netscaler_target_version ~ '.gz') | quote }}
        /var/nsinstall/installns_state;
        then echo INSTALL_STATE_VERSION_OK; else echo INSTALL_STATE_VERSION_MISSING; fi
      delegate_to: "{{ upgrade_target }}"
      register: node_install_state_version
      changed_when: false
      failed_when: false

    - name: Inspect staged completion time without remote Python
      ansible.builtin.raw: >-
        if test -f /var/nsinstall/installns_state
        && grep -q '^END_TIME ' /var/nsinstall/installns_state;
        then echo INSTALL_STATE_END_OK; else echo INSTALL_STATE_END_MISSING; fi
      delegate_to: "{{ upgrade_target }}"
      register: node_install_state_end
      changed_when: false
      failed_when: false

    - name: Inspect persistent installns return code without remote Python
      ansible.builtin.raw: >-
        if test -f {{ node_install_rc | quote }};
        then rc=$(tr -d '[:space:]' < {{ node_install_rc | quote }});
        echo INSTALLNS_RC=$rc; else echo INSTALLNS_RC_MISSING; fi
      delegate_to: "{{ upgrade_target }}"
      register: node_install_rc_existing
      changed_when: false
      failed_when: false

    - name: Inspect running installns process without remote Python
      ansible.builtin.raw: >-
        if pgrep -f '[i]nstallns' >/dev/null 2>&1;
        then echo INSTALLNS_RUNNING; else echo INSTALLNS_NOT_RUNNING; fi
      delegate_to: "{{ upgrade_target }}"
      register: node_install_process_existing
      changed_when: false
      failed_when: false

    - name: Inspect target kernel and boot-loader selection without remote Python
      vars:
        boot_kernel_needle: 'kernel="/ns-{{ netscaler_target_version }}'
      ansible.builtin.raw: >-
        if grep -Fq {{ boot_kernel_needle | quote }}
        /flash/boot/loader.conf 2>/dev/null;
        then echo BOOT_LOADER_TARGET_OK; else echo BOOT_LOADER_TARGET_MISSING; fi;
        if ls /flash/ns-{{ netscaler_target_version }}* >/dev/null 2>&1;
        then echo TARGET_KERNEL_OK; else echo TARGET_KERNEL_MISSING; fi;
        if test -f /flash/boot/loader.conf.local;
        then if grep -Fq {{ boot_kernel_needle | quote }}
        /flash/boot/loader.conf.local;
        then echo LOCAL_BOOT_LOADER_TARGET_OK;
        else echo LOCAL_BOOT_LOADER_TARGET_MISSING; fi;
        else echo LOCAL_BOOT_LOADER_NOT_PRESENT; fi
      delegate_to: "{{ upgrade_target }}"
      register: node_boot_target_existing
      changed_when: false
      failed_when: false

    - name: Parse persistent installns return code
      ansible.builtin.set_fact:
        node_existing_rc_matches: >-
          {{ node_install_rc_existing.stdout | default('') | regex_findall('INSTALLNS_RC=([0-9]+)') }}

    - name: Calculate resumable installns state
      ansible.builtin.set_fact:
        node_install_resume_state: >-
          {{ 'INSTALLNS_FAILED'
             if (node_existing_rc_matches | length > 0 and node_existing_rc_matches[0] | int != 0)
             else 'INSTALLNS_RUNNING'
             if 'INSTALLNS_RUNNING' in (node_install_process_existing.stdout | default(''))
             else 'INSTALLNS_STAGED'
             if (node_existing_rc_matches | length > 0
                 and node_existing_rc_matches[0] | int == 0
                 and 'INSTALL_STATE_VERSION_OK' in (node_install_state_version.stdout | default(''))
                 and 'INSTALL_STATE_END_OK' in (node_install_state_end.stdout | default(''))
                 and 'BOOT_LOADER_TARGET_OK' in (node_boot_target_existing.stdout | default(''))
                 and 'TARGET_KERNEL_OK' in (node_boot_target_existing.stdout | default('')))
             else 'INSTALLNS_REQUIRED' }}

    - name: Reject a previous failed installns unless retry is explicitly authorized
      ansible.builtin.assert:
        that:
          - node_install_resume_state != 'INSTALLNS_FAILED' or retry_failed_installns | bool
        fail_msg: >-
          A previous installns returned RC={{ node_existing_rc_matches[0] | default('unknown') }}
          on {{ upgrade_role_label }}. Inspect {{ node_install_log }}. To authorize
          clearing the failed tracking files and retrying only this installer, set
          retry_failed_installns=true.

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Show safe resume decision"
      ansible.builtin.debug:
        msg: >-
          {{ upgrade_role_label }} installns for {{ netscaler_target_version }}
          {{ 'has matching return code, state, target kernel, and boot-loader entry; continuing at the controlled reboot.' if node_install_resume_state == 'INSTALLNS_STAGED'
             else 'is already running; reconnecting to its persistent return-code file.' if node_install_resume_state == 'INSTALLNS_RUNNING'
             else 'previously failed; explicit retry is authorized.' if node_install_resume_state == 'INSTALLNS_FAILED'
             else 'must run; stale or incomplete installer state is not accepted.' }}

    - name: Remove stale installns tracking files
      ansible.builtin.raw: >-
        rm -f {{ node_install_log | quote }} {{ node_install_rc | quote }}
        {{ node_install_pid | quote }}
      delegate_to: "{{ upgrade_target }}"
      when: >-
        node_install_resume_state == 'INSTALLNS_REQUIRED'
        or (node_install_resume_state == 'INSTALLNS_FAILED' and retry_failed_installns | bool)
      changed_when: true

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Start installns without remote Python on {{ upgrade_role_label }}"
      vars:
        node_install_script: >-
          ./installns -Y -n > {{ node_install_log | quote }} 2>&1;
          rc=$?; echo $rc > {{ node_install_rc | quote }}
      ansible.builtin.raw: >-
        cd {{ (prepared_firmware_remote_installns | dirname) | quote }}
        || exit 1;
        nohup /bin/sh -c {{ node_install_script | quote }}
        </dev/null >/dev/null 2>&1 &
        installer_pid=$!;
        echo $installer_pid > {{ node_install_pid | quote }}
      delegate_to: "{{ upgrade_target }}"
      when: >-
        node_install_resume_state == 'INSTALLNS_REQUIRED'
        or (node_install_resume_state == 'INSTALLNS_FAILED' and retry_failed_installns | bool)
      changed_when: true

    - name: Confirm installns launcher created persistent tracking
      ansible.builtin.raw: >-
        if test -s {{ node_install_pid | quote }};
        then echo INSTALLNS_TRACKING_OK;
        cat {{ node_install_pid | quote }};
        else echo INSTALLNS_TRACKING_MISSING; fi
      delegate_to: "{{ upgrade_target }}"
      register: node_install_launch
      changed_when: false
      when: >-
        node_install_resume_state == 'INSTALLNS_REQUIRED'
        or (node_install_resume_state == 'INSTALLNS_FAILED' and retry_failed_installns | bool)

    - name: Stop immediately if installns did not launch
      ansible.builtin.assert:
        that:
          - "'INSTALLNS_TRACKING_OK' in (node_install_launch.stdout | default(''))"
        fail_msg: >-
          installns did not create its persistent PID file on
          {{ upgrade_role_label }}. No reboot was requested.
      when: >-
        node_install_resume_state == 'INSTALLNS_REQUIRED'
        or (node_install_resume_state == 'INSTALLNS_FAILED' and retry_failed_installns | bool)

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Poll installns completion"
      ansible.builtin.raw: >-
        if test -f {{ node_install_rc | quote }};
        then rc=$(tr -d '[:space:]' < {{ node_install_rc | quote }});
        echo INSTALLNS_RC=$rc;
        elif test -s {{ node_install_pid | quote }}
        && kill -0 $(cat {{ node_install_pid | quote }}) 2>/dev/null;
        then echo INSTALLNS_RC_PENDING;
        else echo INSTALLNS_TRACKING_LOST; fi
      delegate_to: "{{ upgrade_target }}"
      register: node_install_status
      changed_when: false
      failed_when: false
      until: >-
        (node_install_status.stdout | default(''))
        is search('INSTALLNS_RC=[0-9]+|INSTALLNS_TRACKING_LOST')
      retries: >-
        {{ ((upgrade_install_timeout | int) / (upgrade_poll_interval | int)) | round(0, 'ceil') | int }}
      delay: "{{ upgrade_poll_interval | int }}"
      when: node_install_resume_state != 'INSTALLNS_STAGED'

    - name: Stop immediately if installns tracking was lost
      ansible.builtin.assert:
        that:
          - "'INSTALLNS_TRACKING_LOST' not in (node_install_status.stdout | default(''))"
        fail_msg: >-
          installns is not running and did not write its return-code file on
          {{ upgrade_role_label }}. No reboot was requested.
      when: node_install_resume_state != 'INSTALLNS_STAGED'

    - name: Read installns log tail before any reboot
      ansible.builtin.raw: >-
        if test -f {{ node_install_log | quote }};
        then tail -n 200 {{ node_install_log | quote }};
        else echo INSTALLNS_LOG_MISSING; fi
      delegate_to: "{{ upgrade_target }}"
      register: node_install_log_tail
      changed_when: false
      failed_when: false

    - name: Validate staged target version without remote Python
      ansible.builtin.raw: >-
        if test -f /var/nsinstall/installns_state
        && grep -Fqx {{ ('VERSION ns-' ~ netscaler_target_version ~ '.gz') | quote }}
        /var/nsinstall/installns_state;
        then echo INSTALL_STATE_VERSION_OK; else echo INSTALL_STATE_VERSION_MISSING; fi
      delegate_to: "{{ upgrade_target }}"
      register: node_install_state_version_after
      changed_when: false
      failed_when: false

    - name: Validate staged completion time without remote Python
      ansible.builtin.raw: >-
        if test -f /var/nsinstall/installns_state
        && grep -q '^END_TIME ' /var/nsinstall/installns_state;
        then echo INSTALL_STATE_END_OK; else echo INSTALL_STATE_END_MISSING; fi
      delegate_to: "{{ upgrade_target }}"
      register: node_install_state_end_after
      changed_when: false
      failed_when: false

    - name: Validate target kernel and boot-loader selection before reboot
      vars:
        boot_kernel_needle: 'kernel="/ns-{{ netscaler_target_version }}'
      ansible.builtin.raw: >-
        if grep -Fq {{ boot_kernel_needle | quote }}
        /flash/boot/loader.conf 2>/dev/null;
        then echo BOOT_LOADER_TARGET_OK; else echo BOOT_LOADER_TARGET_MISSING; fi;
        if ls /flash/ns-{{ netscaler_target_version }}* >/dev/null 2>&1;
        then echo TARGET_KERNEL_OK; else echo TARGET_KERNEL_MISSING; fi;
        echo BOOT_LOADER_CONTENT_BEGIN;
        grep -n 'kernel' /flash/boot/loader.conf
        /flash/boot/loader.conf.local 2>/dev/null;
        echo BOOT_LOADER_CONTENT_END;
        df -Pk /flash /var
      delegate_to: "{{ upgrade_target }}"
      register: node_boot_target_after
      changed_when: false
      failed_when: false

    - name: Preserve installns evidence on the Ansible controller
      ansible.builtin.copy:
        dest: "{{ node_install_evidence }}"
        mode: "0600"
        content: |
          Run ID: {{ hostvars['localhost'].upgrade_run_id }}
          Pair: {{ pair_name }}
          Role: {{ upgrade_role_label }}
          Host: {{ upgrade_target }} ({{ hostvars[upgrade_target].nsip }})
          Runtime version before install: {{ node_version_before }}
          Target version: {{ netscaler_target_version }}
          Resume decision: {{ node_install_resume_state }}

          === RETURN CODE POLL ===
          {{ (node_install_status | default({})).stdout | default('INSTALLNS_STAGED_RESUME') }}

          === INSTALLNS STATE ===
          {{ node_install_state_version_after.stdout | default('') }}
          {{ node_install_state_end_after.stdout | default('') }}

          === TARGET BOOT EVIDENCE BEFORE REBOOT ===
          {{ node_boot_target_after.stdout | default('') }}

          === INSTALLNS LOG TAIL ===
          {{ node_install_log_tail.stdout | default('') }}
      delegate_to: localhost
      changed_when: true

    - name: Confirm completed installns state
      ansible.builtin.assert:
        that:
          - >-
            node_install_resume_state == 'INSTALLNS_STAGED'
            or 'INSTALLNS_RC=0' in ((node_install_status | default({})).stdout | default(''))
          - "'INSTALL_STATE_VERSION_OK' in (node_install_state_version_after.stdout | default(''))"
          - "'INSTALL_STATE_END_OK' in (node_install_state_end_after.stdout | default(''))"
          - "'BOOT_LOADER_TARGET_OK' in (node_boot_target_after.stdout | default(''))"
          - "'TARGET_KERNEL_OK' in (node_boot_target_after.stdout | default(''))"
        fail_msg: >-
          installns did not leave a complete, bootable {{ netscaler_target_version }} image on
          {{ upgrade_role_label }}. The node will not be rebooted. Review
          {{ node_install_evidence }} on the Ansible controller.

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Request one reboot of {{ upgrade_role_label }}"
      ansible.builtin.uri:
        url: "{{ netscaler_management_protocol }}://{{ hostvars[upgrade_target].nsip }}/nitro/v1/config/reboot"
        method: POST
        status_code: [200, 201, -1]
        body_format: json
        body:
          reboot:
            warm: false
        headers:
          Content-Type: application/json
          X-NITRO-USER: "{{ nitro_user }}"
          X-NITRO-PASS: "{{ nitro_pass }}"
        validate_certs: "{{ netscaler_validate_certs }}"
        timeout: "{{ reboot_request_timeout }}"
      delegate_to: localhost
      register: node_reboot_request
      failed_when: false
      no_log: true

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Confirm {{ upgrade_role_label }} actually started rebooting"
      ansible.builtin.wait_for:
        host: "{{ hostvars[upgrade_target].nsip }}"
        port: "{{ netscaler_ssh_port }}"
        state: stopped
        connect_timeout: 3
        timeout: "{{ [reboot_down_timeout | int, 300] | max }}"
      delegate_to: localhost
      register: node_reboot_down
      changed_when: false
      failed_when: false

    - name: Stop safely if the requested reboot never started
      ansible.builtin.assert:
        that: [not (node_reboot_down.failed | default(false))]
        fail_msg: >-
          The reboot request did not make SSH stop within
          {{ [reboot_down_timeout | int, 300] | max }} seconds.
          No second reboot was sent. Inspect {{ upgrade_role_label }} manually.

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Wait for {{ upgrade_role_label }} SSH to return"
      ansible.builtin.wait_for:
        host: "{{ hostvars[upgrade_target].nsip }}"
        port: "{{ netscaler_ssh_port }}"
        state: started
        delay: "{{ reboot_ssh_initial_delay }}"
        sleep: "{{ reboot_poll_interval }}"
        connect_timeout: 3
        timeout: "{{ [reboot_up_timeout | int, 1200] | max }}"
      delegate_to: localhost
      changed_when: false

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Allow {{ upgrade_role_label }} services to stabilize after SSH returns"
      ansible.builtin.wait_for:
        host: "{{ hostvars[upgrade_target].nsip }}"
        port: "{{ netscaler_ssh_port }}"
        state: started
        delay: "{{ post_reboot_stabilization_seconds | default(180) | int }}"
        sleep: "{{ reboot_poll_interval }}"
        connect_timeout: 3
        timeout: "{{ (post_reboot_stabilization_seconds | default(180) | int) + 60 }}"
      delegate_to: localhost
      changed_when: false

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Announce post-reboot CLI validation"
      ansible.builtin.debug:
        msg: >-
          {{ upgrade_role_label }} SSH returned and was reachable again after the
          {{ post_reboot_stabilization_seconds | default(180) }}-second stabilization window.
          Polling the authenticated NetScaler CLI for up to
          {{ [post_reboot_cli_timeout | int, 600] | max }} seconds.

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Optional management ping"
      ansible.builtin.command:
        argv: [ping, -c, "1", -W, "2", "{{ hostvars[upgrade_target].nsip }}"]
      delegate_to: localhost
      changed_when: false
      when: reboot_ping_check_enabled | bool

- name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Read final {{ upgrade_role_label }} version"
  ansible.builtin.raw: ssh_netscaler_adc show ns version
  delegate_to: "{{ upgrade_target }}"
  register: node_version_after_raw
  until:
    - not (node_version_after_raw.unreachable | default(false))
    - node_version_after_raw.rc | default(1) == 0
    - (node_version_after_raw.stdout | default('')) is search('(?im)NS[0-9]+(?:[.][0-9]+)*: Build [0-9]+(?:[.][0-9]+)*')
  retries: >-
    {{ (([post_reboot_cli_timeout | int, 600] | max) / (reboot_poll_interval | int)) | round(0, 'ceil') | int }}
  delay: "{{ reboot_poll_interval | int }}"
  changed_when: false
  ignore_unreachable: true

- name: Find final version in complete command output
  ansible.builtin.set_fact:
    node_version_after_matches: >-
      {{ node_version_after_raw.stdout | default('')
         | regex_findall('(?im)NS([0-9]+(?:[.][0-9]+)*): Build ([0-9]+(?:[.][0-9]+)*)') }}

- name: Validate final version output
  ansible.builtin.assert:
    that: [node_version_after_matches | length > 0]
    fail_msg: >-
      {{ upgrade_role_label }} did not return an authenticated CLI version within
      {{ [post_reboot_cli_timeout | int, 600] | max }} seconds. If the VM console shows repeated CAM/SCSI
      Busy errors, reset the VM once manually and rerun after validating storage.

- name: Set final version
  ansible.builtin.set_fact:
    node_version_after: "{{ node_version_after_matches[0][0] ~ '-' ~ node_version_after_matches[0][1] }}"

- name: Inspect boot-loader selection after reboot
  vars:
    boot_kernel_needle: 'kernel="/ns-{{ netscaler_target_version }}'
  ansible.builtin.raw: >-
    echo RUNNING_VERSION={{ node_version_after | quote }};
    if grep -Fq {{ boot_kernel_needle | quote }}
    /flash/boot/loader.conf 2>/dev/null;
    then echo BOOT_LOADER_TARGET_OK; else echo BOOT_LOADER_TARGET_MISSING; fi;
    if ls /flash/ns-{{ netscaler_target_version }}* >/dev/null 2>&1;
    then echo TARGET_KERNEL_OK; else echo TARGET_KERNEL_MISSING; fi;
    grep -n 'kernel' /flash/boot/loader.conf
    /flash/boot/loader.conf.local 2>/dev/null;
    df -Pk /flash /var
  delegate_to: "{{ upgrade_target }}"
  register: node_postboot_target
  changed_when: false
  failed_when: false
  when: node_version_before != netscaler_target_version

- name: Preserve post-reboot boot evidence on the Ansible controller
  ansible.builtin.copy:
    dest: "{{ node_postboot_evidence }}"
    mode: "0600"
    content: |
      Run ID: {{ hostvars['localhost'].upgrade_run_id }}
      Pair: {{ pair_name }}
      Role: {{ upgrade_role_label }}
      Host: {{ upgrade_target }} ({{ hostvars[upgrade_target].nsip }})
      Expected version: {{ netscaler_target_version }}
      Observed version: {{ node_version_after }}

      === POST-REBOOT BOOT EVIDENCE ===
      {{ node_postboot_target.stdout | default('') }}
  delegate_to: localhost
  changed_when: true
  when: node_version_before != netscaler_target_version

- name: Record node versions in the pair report
  ansible.builtin.set_fact:
    pair_versions: >-
      {{ pair_versions | combine({upgrade_slot: {
           'before': node_version_before,
           'after': node_version_after,
           'changed': node_version_before != node_version_after
         }}) }}

- name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Validate {{ upgrade_role_label }} version"
  ansible.builtin.assert:
    that: [node_version_after == netscaler_target_version]
    success_msg: "{{ upgrade_role_label }} is running {{ node_version_after }}."
    fail_msg: >-
      {{ upgrade_role_label }} version validation failed: expected
      {{ netscaler_target_version }}, got {{ node_version_after }}. Review
      {{ node_install_evidence | default('the installns evidence file') }} and
      {{ node_postboot_evidence | default('the postboot evidence file') }} on the Ansible controller.
