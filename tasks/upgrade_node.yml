---
- name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Read {{ upgrade_role_label }} version"
  ansible.builtin.shell: >-
    nscli -s -U :{{ nitro_user }}:{{ nitro_pass }} show ns version
  delegate_to: "{{ upgrade_target }}"
  register: node_version_before_raw
  changed_when: false
  no_log: true

- name: Find current version in complete command output
  ansible.builtin.set_fact:
    node_version_before_matches: >-
      {{ node_version_before_raw.stdout
         | regex_findall('(?im)NS([0-9.]+): Build ([0-9.]+)') }}

- name: Validate current version output
  ansible.builtin.assert:
    that:
      - node_version_before_matches | length > 0
    fail_msg: >-
      Could not parse the running version reported by {{ upgrade_role_label }}.
      No disruptive action was taken.

- name: Set current version
  ansible.builtin.set_fact:
    node_version_before: >-
      {{ node_version_before_matches[0][0] ~ '-' ~ node_version_before_matches[0][1] }}

- name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Show {{ upgrade_role_label }} plan"
  ansible.builtin.debug:
    msg: >-
      {{ upgrade_role_label }} {{ hostvars[upgrade_target].nsip }} is {{ node_version_before }};
      target is {{ netscaler_target_version }}.
      {{ 'Upgrade required.' if node_version_before != netscaler_target_version else 'Already at target; disruptive steps will be skipped.' }}

- name: Upgrade node when it is not already at target
  when: node_version_before != netscaler_target_version
  block:
    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Verify preparation marker"
      ansible.builtin.stat:
        path: "{{ prepared_firmware_remote_marker }}"
      delegate_to: "{{ upgrade_target }}"
      register: node_preparation_marker

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Recheck prepared archive SHA-256"
      ansible.builtin.stat:
        path: "{{ prepared_firmware_remote_archive }}"
        checksum_algorithm: sha256
      delegate_to: "{{ upgrade_target }}"
      register: node_prepared_archive

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Verify prepared installns"
      ansible.builtin.stat:
        path: "{{ prepared_firmware_remote_installns }}"
      delegate_to: "{{ upgrade_target }}"
      register: node_prepared_installns

    - name: Confirm this node passed the preparation stage
      ansible.builtin.assert:
        that:
          - node_preparation_marker.stat.exists | bool
          - node_prepared_archive.stat.exists | bool
          - node_prepared_archive.stat.checksum == prepared_firmware_sha256
          - node_prepared_installns.stat.exists | bool
          - node_prepared_installns.stat.isreg | bool
        fail_msg: >-
          The verified preparation marker or installns is missing on
          {{ upgrade_role_label }}. Run upgrade_prep.yaml again.
      delegate_to: localhost

    - name: Set persistent installns tracking paths
      ansible.builtin.set_fact:
        node_install_log: >-
          /var/tmp/ansible-installns-{{ netscaler_target_version | regex_replace('[^A-Za-z0-9_.-]', '_') }}.log
        node_install_rc: >-
          /var/tmp/ansible-installns-{{ netscaler_target_version | regex_replace('[^A-Za-z0-9_.-]', '_') }}.rc
        node_install_pid: >-
          /var/tmp/ansible-installns-{{ netscaler_target_version | regex_replace('[^A-Za-z0-9_.-]', '_') }}.pid

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Inspect resumable installns state"
      ansible.builtin.raw: |
        if grep -Fqx 'VERSION ns-{{ netscaler_target_version }}.gz' /var/nsinstall/installns_state 2>/dev/null \
           && grep -q '^END_TIME ' /var/nsinstall/installns_state 2>/dev/null; then
          echo INSTALLNS_STAGED
        elif [ -f "{{ node_install_rc }}" ]; then
          echo INSTALLNS_TRACKED
        elif [ -f "{{ node_install_pid }}" ] \
             && kill -0 "$(cat "{{ node_install_pid }}")" 2>/dev/null; then
          echo INSTALLNS_RUNNING
        else
          echo INSTALLNS_REQUIRED
        fi
      delegate_to: "{{ upgrade_target }}"
      register: node_installns_state_before
      changed_when: false
      failed_when: false

    - name: Confirm installns state could be inspected
      ansible.builtin.assert:
        that:
          - >-
            'INSTALLNS_' in (node_installns_state_before.stdout | default(''))
        fail_msg: >-
          Could not inspect persistent installns state on
          {{ hostvars[upgrade_target].nsip }}. No installer was started.

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Show safe resume decision"
      ansible.builtin.debug:
        msg: >-
          {{ upgrade_role_label }} installns for {{ netscaler_target_version }}
          {{ 'already completed; continuing at the controlled reboot.'
             if 'INSTALLNS_STAGED' in (node_installns_state_before.stdout | default(''))
             else 'is already running; reconnecting to its persistent tracking files.'
             if 'INSTALLNS_RUNNING' in (node_installns_state_before.stdout | default(''))
             else 'already has a return code; validating the completed process.'
             if 'INSTALLNS_TRACKED' in (node_installns_state_before.stdout | default(''))
             else 'must run; progress will be polled from persistent files on the appliance.' }}

    - name: Remove stale installns tracking files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ node_install_log }}"
        - "{{ node_install_rc }}"
        - "{{ node_install_pid }}"
      delegate_to: "{{ upgrade_target }}"
      when: "'INSTALLNS_REQUIRED' in (node_installns_state_before.stdout | default(''))"

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Start installns on {{ upgrade_role_label }}"
      ansible.builtin.shell:
        cmd: >-
          nohup /bin/sh -c
          {{ ('./installns -Y -n > ' ~ node_install_log ~ ' 2>&1; rc=$?; echo $rc > ' ~ node_install_rc) | quote }}
          </dev/null >/dev/null 2>&1 &
          echo $! > {{ node_install_pid | quote }}
        chdir: "{{ prepared_firmware_remote_installns | dirname }}"
      delegate_to: "{{ upgrade_target }}"
      when: "'INSTALLNS_REQUIRED' in (node_installns_state_before.stdout | default(''))"
      register: node_install_launch

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Poll installns completion"
      ansible.builtin.raw: |
        if [ -f "{{ node_install_rc }}" ]; then
          printf 'RC='
          cat "{{ node_install_rc }}"
        elif [ -f "{{ node_install_pid }}" ] \
             && kill -0 "$(cat "{{ node_install_pid }}")" 2>/dev/null; then
          echo RUNNING
        else
          echo PROCESS_MISSING
        fi
      delegate_to: "{{ upgrade_target }}"
      register: node_install_status
      changed_when: false
      failed_when: false
      until: >-
        'RC=' in (node_install_status.stdout | default('')) or
        'PROCESS_MISSING' in (node_install_status.stdout | default(''))
      retries: >-
        {{ ((upgrade_install_timeout | int) / (upgrade_poll_interval | int))
           | round(0, 'ceil') | int }}
      delay: "{{ upgrade_poll_interval | int }}"
      when: "'INSTALLNS_STAGED' not in (node_installns_state_before.stdout | default(''))"

    - name: Confirm installns returned successfully
      ansible.builtin.assert:
        that:
          - >-
            'RC=0' in (node_install_status.stdout | default(''))
        fail_msg: >-
          installns did not finish successfully on {{ upgrade_role_label }}.
          Inspect {{ node_install_log }} on {{ hostvars[upgrade_target].nsip }}.
      when: "'INSTALLNS_STAGED' not in (node_installns_state_before.stdout | default(''))"

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Validate completed installns state"
      ansible.builtin.raw: |
        grep -Fqx 'VERSION ns-{{ netscaler_target_version }}.gz' /var/nsinstall/installns_state 2>/dev/null \
          && grep -q '^END_TIME ' /var/nsinstall/installns_state 2>/dev/null
      delegate_to: "{{ upgrade_target }}"
      register: node_installns_state_after
      changed_when: false

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Reboot {{ upgrade_role_label }}"
      ansible.builtin.uri:
        url: >-
          {{ netscaler_management_protocol }}://{{ hostvars[upgrade_target].nsip }}/nitro/v1/config/reboot
        method: POST
        status_code: [200, 201]
        body_format: json
        body:
          reboot:
            warm: false
        headers:
          Content-Type: application/json
          X-NITRO-USER: "{{ nitro_user }}"
          X-NITRO-PASS: "{{ nitro_pass }}"
        validate_certs: "{{ netscaler_validate_certs }}"
      delegate_to: localhost
      no_log: true

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Wait for {{ upgrade_role_label }} SSH to stop"
      ansible.builtin.wait_for:
        host: "{{ hostvars[upgrade_target].nsip }}"
        port: "{{ netscaler_ssh_port }}"
        state: stopped
        timeout: "{{ reboot_down_timeout }}"
      delegate_to: localhost

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Wait for {{ upgrade_role_label }} SSH to return"
      ansible.builtin.wait_for:
        host: "{{ hostvars[upgrade_target].nsip }}"
        port: "{{ netscaler_ssh_port }}"
        state: started
        delay: 30
        timeout: "{{ reboot_up_timeout }}"
      delegate_to: localhost

    - name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Wait for HA synchronization"
      ansible.builtin.wait_for:
        timeout: "{{ ha_stabilization_seconds }}"
      delegate_to: localhost

- name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Read final {{ upgrade_role_label }} version"
  ansible.builtin.shell: >-
    nscli -s -U :{{ nitro_user }}:{{ nitro_pass }} show ns version
  delegate_to: "{{ upgrade_target }}"
  register: node_version_after_raw
  changed_when: false
  no_log: true

- name: Find final version in complete command output
  ansible.builtin.set_fact:
    node_version_after_matches: >-
      {{ node_version_after_raw.stdout
         | regex_findall('(?im)NS([0-9.]+): Build ([0-9.]+)') }}

- name: Validate final version output
  ansible.builtin.assert:
    that:
      - node_version_after_matches | length > 0
    fail_msg: >-
      Could not parse the version reported after reboot by
      {{ upgrade_role_label }}.

- name: Set final version
  ansible.builtin.set_fact:
    node_version_after: >-
      {{ node_version_after_matches[0][0] ~ '-' ~ node_version_after_matches[0][1] }}

- name: Record node versions in the pair report
  ansible.builtin.set_fact:
    pair_versions: >-
      {{ pair_versions | combine({upgrade_slot: {
           'before': node_version_before,
           'after': node_version_after,
           'changed': node_version_before != node_version_after
         }}) }}

- name: "STEP {{ upgrade_step_range }}/12 | {{ pair_name }} | Validate {{ upgrade_role_label }} version"
  ansible.builtin.assert:
    that:
      - node_version_after == netscaler_target_version
    success_msg: "{{ upgrade_role_label }} is running {{ node_version_after }}."
    fail_msg: >-
      {{ upgrade_role_label }} version validation failed: expected
      {{ netscaler_target_version }}, got {{ node_version_after }}.
