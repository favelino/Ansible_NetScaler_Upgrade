# Target version used by the actual upgrade validation.
netscaler_target_version: "14.1-73.33" # Format: "release-build", for example "14.1-73.33"

# NetScaler Console inventory discovery. Replace the URL or override with -e.
netscaler_console_url: "https://console.example.com"
netscaler_console_ca_bundle: ""
netscaler_console_insecure: false
inventory_output: "inventory.ini"
# Optional offline fixture used only for testing; leave empty in production.
prep_inventory_input_json: ""

# Stage 1 firmware preparation
firmware_local_directory: "new_firmware"
firmware_remote_directory: "/var/nsinstall"
prepared_firmware_metadata: "prepared_firmware.yml"
minimum_var_free_gb: 5
prep_devices_parallel: 20

# Parallelism: number of complete HA pairs upgraded at the same time.
# Override at runtime with: -e ha_pairs_parallel=5
ha_pairs_parallel: 2

# Connectivity, reboot, installer, and HA polling timers (seconds).
# Timeouts are maximums; successful checks continue immediately.
netscaler_ssh_port: 22
preflight_connect_timeout: 5
reboot_request_timeout: 30
reboot_down_timeout: 120
reboot_up_timeout: 600
reboot_ssh_initial_delay: 5
reboot_poll_interval: 5
post_reboot_cli_timeout: 180
reboot_ping_check_enabled: false
ha_transition_timeout: 180
ha_poll_interval: 5
recovery_probe_timeout: 60
upgrade_install_timeout: 3600
upgrade_poll_interval: 15

# Safety controls.
create_pre_upgrade_backup: true
retry_failed_installns: false

# NITRO reboot endpoint. HTTPS is recommended.
netscaler_management_protocol: https
netscaler_validate_certs: false

# Reports are created on the Ansible control node.
report_directory: reports
