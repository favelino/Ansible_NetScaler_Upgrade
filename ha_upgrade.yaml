---
- name: Initialize the NetScaler HA upgrade run
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - variables.yaml
    - "{{ lookup('ansible.builtin.first_found', {'files': ['prepared_firmware.yml', 'prepared_firmware.yml.example'], 'paths': [playbook_dir]}) }}"
  tasks:
    - name: Validate concurrency and inventory
      ansible.builtin.assert:
        that:
          - ha_pairs_parallel | int > 0
          - groups['netscaler_ha_pairs'] | default([]) | length > 0
          - groups['netscaler_nodes'] | default([]) | length > 0
        fail_msg: "Inventory must contain NetScaler nodes and HA pairs; ha_pairs_parallel must be greater than zero."

    - name: Calculate current inventory SHA-256
      ansible.builtin.stat:
        path: "{{ prepared_inventory_file }}"
        checksum_algorithm: sha256
      register: perform_inventory_stat

    - name: Enforce successful preparation gate
      ansible.builtin.assert:
        that:
          - prepared_firmware_successful | bool
          - prepared_device_count | int == expected_device_count | int
          - prepared_target_version | default('NOT_PREPARED') == netscaler_target_version
          - perform_inventory_stat.stat.exists | bool
          - perform_inventory_stat.stat.checksum == prepared_inventory_sha256
        fail_msg: >-
          The preparation gate is not valid. Run upgrade_prep.yaml successfully
          and do not modify inventory.ini or the target version between stages.
        success_msg: >-
          Preparation gate accepted for {{ prepared_device_count }} devices.
          Firmware SHA-256={{ prepared_firmware_sha256 }}.

    - name: Create run metadata
      ansible.builtin.set_fact:
        upgrade_run_id: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
        upgrade_run_started: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
        upgrade_run_started_epoch: "{{ lookup('pipe', 'date -u +%s') | int }}"

    - name: Create the report directory
      ansible.builtin.file:
        path: "{{ report_directory }}"
        state: directory
        mode: "0700"

    - name: Announce the run
      ansible.builtin.debug:
        msg: >-
          Starting run {{ upgrade_run_id }} for {{ groups['netscaler_ha_pairs'] | length }} HA pairs
          ({{ groups['netscaler_nodes'] | length }} devices), with up to
          {{ ha_pairs_parallel | int }} pairs executing simultaneously.

- name: Preflight connectivity for every NetScaler
  hosts: netscaler_nodes
  connection: local
  gather_facts: false
  strategy: free
  vars_files:
    - variables.yaml
    - "{{ lookup('ansible.builtin.first_found', {'files': ['prepared_firmware.yml', 'prepared_firmware.yml.example'], 'paths': [playbook_dir]}) }}"
  tasks:
    - name: "PREFLIGHT | Test SSH connectivity to {{ netscaler_hostname | default(inventory_hostname) }} ({{ nsip }})"
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(nsip) }}"
        port: "{{ netscaler_ssh_port }}"
        connect_timeout: "{{ preflight_connect_timeout }}"
        timeout: "{{ preflight_connect_timeout }}"
        state: started
      delegate_to: localhost
      register: preflight_connection
      ignore_errors: true
      changed_when: false

    - name: Record preflight result
      ansible.builtin.set_fact:
        upgrade_reachable: "{{ not (preflight_connection.failed | default(false)) }}"
      delegate_to: localhost

- name: Summarize fleet preflight
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - variables.yaml
    - "{{ lookup('ansible.builtin.first_found', {'files': ['prepared_firmware.yml', 'prepared_firmware.yml.example'], 'paths': [playbook_dir]}) }}"
  tasks:
    - name: Initialize reachability lists
      ansible.builtin.set_fact:
        reachable_devices: []
        unreachable_devices: []

    - name: Collect reachable devices
      ansible.builtin.set_fact:
        reachable_devices: "{{ reachable_devices + [item] }}"
      loop: "{{ groups['netscaler_nodes'] }}"
      when: hostvars[item].upgrade_reachable | default(false) | bool

    - name: Collect unreachable devices
      ansible.builtin.set_fact:
        unreachable_devices: >-
          {{ unreachable_devices + [hostvars[item].netscaler_hostname ~
             ' (' ~ hostvars[item].nsip ~ ')'] }}
      loop: "{{ groups['netscaler_nodes'] }}"
      when: not (hostvars[item].upgrade_reachable | default(false) | bool)

    - name: Display fleet reachability
      ansible.builtin.debug:
        msg: >-
          Connecting to {{ groups['netscaler_nodes'] | length }} devices:
          {{ reachable_devices | length }} reachable,
          {{ unreachable_devices | length }} not reachable.
          Unreachable devices: {{ unreachable_devices | join(', ') if unreachable_devices | length else 'none' }}.

- name: Upgrade NetScaler HA pairs
  hosts: netscaler_ha_pairs
  connection: local
  gather_facts: false
  serial: "{{ ha_pairs_parallel | int }}"
  max_fail_percentage: 100
  ignore_unreachable: true
  vars_files:
    - variables.yaml
    - "{{ lookup('ansible.builtin.first_found', {'files': ['prepared_firmware.yml', 'prepared_firmware.yml.example'], 'paths': [playbook_dir]}) }}"
  pre_tasks:
    - name: Initialize pair progress and report data
      ansible.builtin.set_fact:
        pair_status: RUNNING
        pair_error: ""
        pair_versions: {}
        ha_controls_change_started: false
        ha_controls_restored: false
        pair_manual_recovery: false
        pair_started_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
        pair_started_epoch: "{{ lookup('pipe', 'date -u +%s') | int }}"

    - name: "STEP 01/12 | {{ pair_name }} | Start"
      ansible.builtin.debug:
        msg: >-
          Starting {{ pair_name }}. Original Primary={{ primary_nsip }},
          original Secondary={{ secondary_nsip }}.

  tasks:
    - name: Execute the ordered HA upgrade
      block:
        - name: "STEP 02/12 | {{ pair_name }} | Confirm both devices passed preflight"
          ansible.builtin.assert:
            that:
              - hostvars[primary_host].upgrade_reachable | default(false) | bool
              - hostvars[secondary_host].upgrade_reachable | default(false) | bool
            fail_msg: >-
              Pair blocked because one or both devices failed preflight:
              {{ primary_host }}={{ hostvars[primary_host].upgrade_reachable | default(false) }},
              {{ secondary_host }}={{ hostvars[secondary_host].upgrade_reachable | default(false) }}.

        - name: "STEP 02/12 | {{ pair_name }} | Confirm original Primary role is still current"
          ansible.builtin.raw: >-
            ssh_netscaler_adc show ha node 0
          delegate_to: "{{ primary_host }}"
          register: initial_primary_ha
          changed_when: false

        - name: "STEP 02/12 | {{ pair_name }} | Confirm original Secondary role is still current"
          ansible.builtin.raw: >-
            ssh_netscaler_adc show ha node 0
          delegate_to: "{{ secondary_host }}"
          register: initial_secondary_ha
          changed_when: false

        - name: "STEP 02/12 | {{ pair_name }} | Reject stale HA role data"
          ansible.builtin.assert:
            that:
              - initial_primary_ha.stdout is search('(?im)^\\s*Master State\\s*:\\s*Primary')
              - initial_secondary_ha.stdout is search('(?im)^\\s*Master State\\s*:\\s*Secondary')
              - initial_primary_ha.stdout is search('(?im)^\\s*Node State\\s*:\\s*UP\\s*$')
              - initial_secondary_ha.stdout is search('(?im)^\\s*Node State\\s*:\\s*UP\\s*$')
            fail_msg: >-
              Live HA roles no longer match inventory.ini. Run upgrade_prep.yaml again
              before attempting this pair.

        - name: "STEP 02/12 | {{ pair_name }} | Read both running versions before HA reconciliation"
          ansible.builtin.raw: ssh_netscaler_adc show ns version
          delegate_to: "{{ item }}"
          loop:
            - "{{ primary_host }}"
            - "{{ secondary_host }}"
          loop_control:
            label: "{{ hostvars[item].netscaler_hostname | default(item) }} ({{ hostvars[item].nsip }})"
          register: pre_isolation_versions
          changed_when: false

        - name: "STEP 02/12 | {{ pair_name }} | Parse both running versions before HA reconciliation"
          ansible.builtin.set_fact:
            pre_isolation_primary_version_matches: >-
              {{ pre_isolation_versions.results[0].stdout | default('')
                 | regex_findall('(?im)NS([0-9]+(?:[.][0-9]+)*): Build ([0-9]+(?:[.][0-9]+)*)') }}
            pre_isolation_secondary_version_matches: >-
              {{ pre_isolation_versions.results[1].stdout | default('')
                 | regex_findall('(?im)NS([0-9]+(?:[.][0-9]+)*): Build ([0-9]+(?:[.][0-9]+)*)') }}

        - name: "STEP 02/12 | {{ pair_name }} | Require matching versions before HA reconciliation"
          ansible.builtin.assert:
            that:
              - pre_isolation_primary_version_matches | length > 0
              - pre_isolation_secondary_version_matches | length > 0
              - (pre_isolation_primary_version_matches[0][0] ~ '-' ~ pre_isolation_primary_version_matches[0][1]) == (pre_isolation_secondary_version_matches[0][0] ~ '-' ~ pre_isolation_secondary_version_matches[0][1])
            fail_msg: >-
              The pair entered Stage 2 with mixed or unreadable versions. HA controls
              were not changed and no upgrade was started.

        - name: "STEP 02/12 | {{ pair_name }} | Normalize HA sync and propagation before isolation"
          ansible.builtin.raw: >-
            ssh_netscaler_adc set ha node -hasync ENABLED -haprop ENABLED
          delegate_to: "{{ item }}"
          loop:
            - "{{ primary_host }}"
            - "{{ secondary_host }}"
          loop_control:
            label: "{{ hostvars[item].netscaler_hostname | default(item) }} ({{ hostvars[item].nsip }})"
          register: ha_baseline_enable_commands
          until:
            - not (ha_baseline_enable_commands.unreachable | default(false))
            - ha_baseline_enable_commands.rc | default(1) == 0
          retries: >-
            {{ ((ha_transition_timeout | int) / (ha_poll_interval | int)) | round(0, 'ceil') | int }}
          delay: "{{ ha_poll_interval }}"
          changed_when: true

        - name: "STEP 02/12 | {{ pair_name }} | Save normalized HA controls"
          ansible.builtin.raw: ssh_netscaler_adc save ns config
          delegate_to: "{{ item }}"
          loop:
            - "{{ primary_host }}"
            - "{{ secondary_host }}"
          loop_control:
            label: "{{ hostvars[item].netscaler_hostname | default(item) }} ({{ hostvars[item].nsip }})"
          register: ha_baseline_save_commands
          changed_when: >-
            ha_baseline_save_commands.rc == 0
            and 'running configuration has not changed' not in
                (ha_baseline_save_commands.stdout | default('') | lower)
          failed_when:
            - ha_baseline_save_commands.rc != 0
            - "'running configuration has not changed' not in (ha_baseline_save_commands.stdout | default('') | lower)"

        - name: "STEP 02/12 | {{ pair_name }} | Wait for normalized HA controls before clean synchronization"
          ansible.builtin.raw: ssh_netscaler_adc show ha node 0
          delegate_to: "{{ item }}"
          loop:
            - "{{ primary_host }}"
            - "{{ secondary_host }}"
          loop_control:
            label: "{{ hostvars[item].netscaler_hostname | default(item) }} ({{ hostvars[item].nsip }})"
          register: ha_baseline_controls_before_sync
          until:
            - not (ha_baseline_controls_before_sync.unreachable | default(false))
            - ha_baseline_controls_before_sync.rc | default(1) == 0
            - (ha_baseline_controls_before_sync.stdout | default('')) is search('(?im)^\s*Sync State\s*:\s*(ENABLED|SUCCESS)\s*$')
            - (ha_baseline_controls_before_sync.stdout | default('')) is search('(?im)^\s*Propagation\s*:\s*ENABLED\s*$')
          retries: >-
            {{ ((ha_transition_timeout | int) / (ha_poll_interval | int)) | round(0, 'ceil') | int }}
          delay: "{{ ha_poll_interval }}"
          changed_when: false

        - name: "STEP 02/12 | {{ pair_name }} | Force a clean synchronization before isolation"
          ansible.builtin.raw: ssh_netscaler_adc force ha sync
          delegate_to: "{{ primary_host }}"
          register: ha_baseline_sync
          changed_when: true

        - name: "STEP 02/12 | {{ pair_name }} | Wait for healthy HA controls before isolation"
          ansible.builtin.raw: >-
            ssh_netscaler_adc show ha node 0
          delegate_to: "{{ item }}"
          loop:
            - "{{ primary_host }}"
            - "{{ secondary_host }}"
          loop_control:
            label: "{{ hostvars[item].netscaler_hostname | default(item) }} ({{ hostvars[item].nsip }})"
          register: initial_local_ha_controls
          until:
            - not (initial_local_ha_controls.unreachable | default(false))
            - initial_local_ha_controls.rc | default(1) == 0
            - (initial_local_ha_controls.stdout | default('')) is search('(?im)^\s*Sync State\s*:\s*(ENABLED|SUCCESS)\s*$')
            - (initial_local_ha_controls.stdout | default('')) is search('(?im)^\s*Propagation\s*:\s*ENABLED\s*$')
          retries: >-
            {{ ((ha_transition_timeout | int) / (ha_poll_interval | int)) | round(0, 'ceil') | int }}
          delay: "{{ ha_poll_interval }}"
          changed_when: false

        - name: "STEP 02/12 | {{ pair_name }} | Require healthy HA controls before isolation after reconciliation"
          ansible.builtin.assert:
            that:
              - (item.stdout | default('')) is search('(?im)^\\s*Sync State\\s*:\\s*(ENABLED|SUCCESS)\\s*$')
              - (item.stdout | default('')) is search('(?im)^\\s*Propagation\\s*:\\s*ENABLED\\s*$')
            fail_msg: >-
              Local haSync or haProp could not be normalized on
              {{ hostvars[item.item].netscaler_hostname | default(item.item) }}
              ({{ hostvars[item.item].nsip }}). No disruptive action was taken.
          loop: "{{ initial_local_ha_controls.results }}"
          loop_control:
            label: "{{ hostvars[item.item].netscaler_hostname | default(item.item) }} ({{ hostvars[item.item].nsip }})"

        - name: "STEP 02/12 | {{ pair_name }} | Mark HA isolation as started"
          ansible.builtin.set_fact:
            ha_controls_change_started: true

        - name: "STEP 02/12 | {{ pair_name }} | Disable HA sync and propagation"
          ansible.builtin.raw: >-
            ssh_netscaler_adc set ha node -hasync DISABLED -haprop DISABLED
          delegate_to: "{{ item }}"
          loop:
            - "{{ primary_host }}"
            - "{{ secondary_host }}"
          loop_control:
            label: "{{ hostvars[item].netscaler_hostname | default(item) }} ({{ hostvars[item].nsip }})"
          register: ha_disable_commands
          changed_when: true

        - name: "STEP 02/12 | {{ pair_name }} | Save disabled HA controls"
          ansible.builtin.raw: >-
            ssh_netscaler_adc save ns config
          delegate_to: "{{ item }}"
          loop:
            - "{{ primary_host }}"
            - "{{ secondary_host }}"
          loop_control:
            label: "{{ hostvars[item].netscaler_hostname | default(item) }} ({{ hostvars[item].nsip }})"
          register: ha_disable_save_commands
          changed_when: >-
            ha_disable_save_commands.rc == 0
            and 'running configuration has not changed' not in
                (ha_disable_save_commands.stdout | default('') | lower)
          failed_when:
            - ha_disable_save_commands.rc != 0
            - "'running configuration has not changed' not in (ha_disable_save_commands.stdout | default('') | lower)"

        - name: "STEP 02/12 | {{ pair_name }} | Read isolated local HA controls"
          ansible.builtin.raw: >-
            ssh_netscaler_adc show ha node 0
          delegate_to: "{{ item }}"
          loop:
            - "{{ primary_host }}"
            - "{{ secondary_host }}"
          loop_control:
            label: "{{ hostvars[item].netscaler_hostname | default(item) }} ({{ hostvars[item].nsip }})"
          register: isolated_local_ha_controls
          changed_when: false

        - name: "STEP 02/12 | {{ pair_name }} | Confirm HA isolation"
          ansible.builtin.assert:
            that:
              - (item.stdout | default('')) is search('(?im)^\\s*Sync State\\s*:\\s*DISABLED\\s*$')
              - (item.stdout | default('')) is search('(?im)^\\s*Propagation\\s*:\\s*DISABLED\\s*$')
            fail_msg: >-
              haSync or haProp was not confirmed DISABLED on
              {{ hostvars[item.item].netscaler_hostname | default(item.item) }}
              ({{ hostvars[item.item].nsip }}). The always section will attempt restoration.
          loop: "{{ isolated_local_ha_controls.results }}"
          loop_control:
            label: "{{ hostvars[item.item].netscaler_hostname | default(item.item) }} ({{ hostvars[item.item].nsip }})"

        - name: "STEP 02/12 | {{ pair_name }} | Announce confirmed HA isolation"
          ansible.builtin.debug:
            msg: >-
              HA synchronization and command propagation are disabled, saved, and
              verified on both nodes for the duration of this pair upgrade.

        - name: "STEP 03-05/12 | {{ pair_name }} | Upgrade original Secondary"
          ansible.builtin.include_tasks: tasks/upgrade_node.yml
          vars:
            upgrade_target: "{{ secondary_host }}"
            upgrade_slot: secondary
            upgrade_role_label: Original Secondary
            upgrade_step_range: "03-05"

        - name: "STEP 06/12 | {{ pair_name }} | Read both local states before failover"
          ansible.builtin.raw: ssh_netscaler_adc show ha node 0
          delegate_to: "{{ item }}"
          loop:
            - "{{ primary_host }}"
            - "{{ secondary_host }}"
          register: pre_failover_health
          changed_when: false

        - name: "STEP 06/12 | {{ pair_name }} | Require both nodes UP before failover"
          ansible.builtin.assert:
            that:
              - (item.stdout | default('')) is search('(?im)^\\s*Node State\\s*:\\s*UP\\s*$')
              - >-
                (item.item == primary_host and
                 (item.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Primary\\s*$'))
                or
                (item.item == secondary_host and
                 (item.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Secondary\\s*$'))
            fail_msg: >-
              {{ hostvars[item.item].netscaler_hostname | default(item.item) }} is not
              locally UP in its expected pre-failover role. The original Primary
              will not be upgraded.
          loop: "{{ pre_failover_health.results }}"

        - name: "STEP 06/12 | {{ pair_name }} | Fail over to upgraded Secondary"
          ansible.builtin.raw: >-
            ssh_netscaler_adc force ha failover -force
          delegate_to: "{{ secondary_host }}"
          register: first_failover
          changed_when: true

        - name: "STEP 06/12 | {{ pair_name }} | Confirm original Secondary is now Primary"
          ansible.builtin.raw: >-
            ssh_netscaler_adc show ha node 0
          delegate_to: "{{ secondary_host }}"
          register: failover_secondary_ha
          until:
            - failover_secondary_ha.rc | default(1) == 0
            - (failover_secondary_ha.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Primary\\s*$')
            - (failover_secondary_ha.stdout | default('')) is search('(?im)^\\s*Node State\\s*:\\s*UP\\s*$')
          retries: "{{ ((ha_transition_timeout | int) / (ha_poll_interval | int)) | round(0, 'ceil') | int }}"
          delay: "{{ ha_poll_interval }}"
          changed_when: false

        - name: "STEP 06/12 | {{ pair_name }} | Confirm original Primary is now Secondary"
          ansible.builtin.raw: >-
            ssh_netscaler_adc show ha node 0
          delegate_to: "{{ primary_host }}"
          register: failover_primary_ha
          until:
            - failover_primary_ha.rc | default(1) == 0
            - (failover_primary_ha.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Secondary\\s*$')
            - (failover_primary_ha.stdout | default('')) is search('(?im)^\\s*Node State\\s*:\\s*UP\\s*$')
          retries: "{{ ((ha_transition_timeout | int) / (ha_poll_interval | int)) | round(0, 'ceil') | int }}"
          delay: "{{ ha_poll_interval }}"
          changed_when: false

        - name: "STEP 06/12 | {{ pair_name }} | Verify failover before upgrading original Primary"
          ansible.builtin.assert:
            that:
              - failover_secondary_ha.stdout is search('(?im)^\\s*Master State\\s*:\\s*Primary')
              - failover_primary_ha.stdout is search('(?im)^\\s*Master State\\s*:\\s*Secondary')
            fail_msg: >-
              Failover did not leave the original Secondary as Primary and the
              original Primary as Secondary. Stop this pair and inspect HA state.

        - name: "STEP 07-09/12 | {{ pair_name }} | Upgrade original Primary"
          ansible.builtin.include_tasks: tasks/upgrade_node.yml
          vars:
            upgrade_target: "{{ primary_host }}"
            upgrade_slot: primary
            upgrade_role_label: Original Primary
            upgrade_step_range: "07-09"

        - name: "STEP 10/12 | {{ pair_name }} | Read both local states before failback"
          ansible.builtin.raw: ssh_netscaler_adc show ha node 0
          delegate_to: "{{ item }}"
          loop:
            - "{{ primary_host }}"
            - "{{ secondary_host }}"
          register: pre_failback_health
          changed_when: false

        - name: "STEP 10/12 | {{ pair_name }} | Require both nodes UP in inverted roles"
          ansible.builtin.assert:
            that:
              - (item.stdout | default('')) is search('(?im)^\\s*Node State\\s*:\\s*UP\\s*$')
              - >-
                (item.item == primary_host and
                 (item.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Secondary\\s*$'))
                or
                (item.item == secondary_host and
                 (item.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Primary\\s*$'))
            fail_msg: >-
              {{ hostvars[item.item].netscaler_hostname | default(item.item) }} is not
              locally UP in its expected pre-failback role. No blind failover was sent.
          loop: "{{ pre_failback_health.results }}"

        - name: "STEP 10/12 | {{ pair_name }} | Restore original HA roles"
          ansible.builtin.raw: >-
            ssh_netscaler_adc force ha failover -force
          delegate_to: "{{ primary_host }}"
          register: restore_failover
          changed_when: true

        - name: "STEP 11/12 | {{ pair_name }} | Read final HA state from original Primary"
          ansible.builtin.raw: >-
            ssh_netscaler_adc show ha node 0
          delegate_to: "{{ primary_host }}"
          register: final_primary_ha
          until:
            - final_primary_ha.rc | default(1) == 0
            - (final_primary_ha.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Primary\\s*$')
            - (final_primary_ha.stdout | default('')) is search('(?im)^\\s*Node State\\s*:\\s*UP\\s*$')
          retries: "{{ ((ha_transition_timeout | int) / (ha_poll_interval | int)) | round(0, 'ceil') | int }}"
          delay: "{{ ha_poll_interval }}"
          changed_when: false

        - name: "STEP 11/12 | {{ pair_name }} | Read final HA state from original Secondary"
          ansible.builtin.raw: >-
            ssh_netscaler_adc show ha node 0
          delegate_to: "{{ secondary_host }}"
          register: final_secondary_ha
          until:
            - final_secondary_ha.rc | default(1) == 0
            - (final_secondary_ha.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Secondary\\s*$')
            - (final_secondary_ha.stdout | default('')) is search('(?im)^\\s*Node State\\s*:\\s*UP\\s*$')
          retries: "{{ ((ha_transition_timeout | int) / (ha_poll_interval | int)) | round(0, 'ceil') | int }}"
          delay: "{{ ha_poll_interval }}"
          changed_when: false

        - name: "STEP 12/12 | {{ pair_name }} | Validate versions and restored roles"
          ansible.builtin.assert:
            that:
              - pair_versions.primary.after == netscaler_target_version
              - pair_versions.secondary.after == netscaler_target_version
              - final_primary_ha.stdout is search('(?im)^\\s*Master State\\s*:\\s*Primary')
              - final_secondary_ha.stdout is search('(?im)^\\s*Master State\\s*:\\s*Secondary')
            fail_msg: "Final validation failed. Versions or original HA roles do not match the requested end state."
            success_msg: >-
              {{ pair_name }} completed correctly: both nodes are {{ netscaler_target_version }}
              and the original Primary/Secondary roles were restored.

        - name: Mark pair successful
          ansible.builtin.set_fact:
            pair_status: SUCCESS

      rescue:
        - name: Record pair failure
          ansible.builtin.set_fact:
            pair_status: FAILED
            pair_error: >-
              {{ ansible_failed_task.action | default('Unknown task') }}:
              {{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('No error text returned')) }}

        - name: Display pair failure
          ansible.builtin.debug:
            msg: "FAILED | {{ pair_name }} | {{ pair_error }}"

      always:
        - name: Read live original Primary version for safe recovery
          ansible.builtin.raw: ssh_netscaler_adc show ns version
          delegate_to: "{{ primary_host }}"
          register: recovery_primary_version_raw
          until:
            - not (recovery_primary_version_raw.unreachable | default(false))
            - recovery_primary_version_raw.rc | default(1) == 0
          retries: >-
            {{ ((recovery_probe_timeout | int) / (ha_poll_interval | int)) | round(0, 'ceil') | int }}
          delay: "{{ ha_poll_interval }}"
          changed_when: false
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true
          when: ha_controls_change_started | default(false) | bool

        - name: Read live original Secondary version for safe recovery
          ansible.builtin.raw: ssh_netscaler_adc show ns version
          delegate_to: "{{ secondary_host }}"
          register: recovery_secondary_version_raw
          until:
            - not (recovery_secondary_version_raw.unreachable | default(false))
            - recovery_secondary_version_raw.rc | default(1) == 0
          retries: >-
            {{ ((recovery_probe_timeout | int) / (ha_poll_interval | int)) | round(0, 'ceil') | int }}
          delay: "{{ ha_poll_interval }}"
          changed_when: false
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true
          when: ha_controls_change_started | default(false) | bool

        - name: Parse live versions and decide whether HA restoration is safe
          ansible.builtin.set_fact:
            recovery_primary_version_matches: >-
              {{ recovery_primary_version_raw.stdout | default('')
                 | regex_findall('(?im)NS([0-9]+(?:[.][0-9]+)*): Build ([0-9]+(?:[.][0-9]+)*)') }}
            recovery_secondary_version_matches: >-
              {{ recovery_secondary_version_raw.stdout | default('')
                 | regex_findall('(?im)NS([0-9]+(?:[.][0-9]+)*): Build ([0-9]+(?:[.][0-9]+)*)') }}
          when: ha_controls_change_started | default(false) | bool

        - name: Calculate live recovery versions
          ansible.builtin.set_fact:
            recovery_primary_version: >-
              {{ recovery_primary_version_matches[0][0] ~ '-' ~ recovery_primary_version_matches[0][1]
                 if recovery_primary_version_matches | default([]) | length else 'unknown' }}
            recovery_secondary_version: >-
              {{ recovery_secondary_version_matches[0][0] ~ '-' ~ recovery_secondary_version_matches[0][1]
                 if recovery_secondary_version_matches | default([]) | length else 'unknown' }}
          when: ha_controls_change_started | default(false) | bool

        - name: Determine whether both live versions match
          ansible.builtin.set_fact:
            ha_versions_match: >-
              {{ recovery_primary_version != 'unknown'
                 and recovery_secondary_version != 'unknown'
                 and recovery_primary_version == recovery_secondary_version }}
          when: ha_controls_change_started | default(false) | bool

        - name: Keep mixed or unknown versions isolated for manual recovery
          ansible.builtin.set_fact:
            pair_status: MANUAL_RECOVERY_REQUIRED
            pair_manual_recovery: true
            pair_error: >-
              {{ (pair_error ~ '; ' if pair_error | length else '') ~
                 'HA isolation was intentionally retained because live versions do not match or a node is unreachable: Primary=' ~
                 recovery_primary_version ~ ', Secondary=' ~ recovery_secondary_version ~
                 '. The original Primary was not upgraded after a Secondary failure.' }}
          when:
            - ha_controls_change_started | default(false) | bool
            - not (ha_versions_match | default(false) | bool)

        - name: Read original Primary local role before recovery failback
          ansible.builtin.raw: ssh_netscaler_adc show ha node 0
          delegate_to: "{{ primary_host }}"
          register: recovery_primary_role
          changed_when: false
          failed_when: false
          ignore_unreachable: true
          when: ha_versions_match | default(false) | bool

        - name: Read original Secondary local role before recovery failback
          ansible.builtin.raw: ssh_netscaler_adc show ha node 0
          delegate_to: "{{ secondary_host }}"
          register: recovery_secondary_role
          changed_when: false
          failed_when: false
          ignore_unreachable: true
          when: ha_versions_match | default(false) | bool

        - name: Classify current recovery roles
          ansible.builtin.set_fact:
            recovery_roles_original: >-
              {{ (recovery_primary_role.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Primary\\s*$')
                 and (recovery_secondary_role.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Secondary\\s*$') }}
            recovery_roles_inverted: >-
              {{ (recovery_primary_role.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Secondary\\s*$')
                 and (recovery_secondary_role.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Primary\\s*$') }}
          when: ha_versions_match | default(false) | bool

        - name: Restore original roles when both upgraded nodes are inverted
          ansible.builtin.raw: ssh_netscaler_adc force ha failover -force
          delegate_to: "{{ primary_host }}"
          register: recovery_failback
          changed_when: true
          ignore_errors: true
          ignore_unreachable: true
          when:
            - ha_versions_match | default(false) | bool
            - recovery_roles_inverted | default(false) | bool

        - name: Confirm original Primary role after recovery failback
          ansible.builtin.raw: ssh_netscaler_adc show ha node 0
          delegate_to: "{{ primary_host }}"
          register: recovery_final_primary_role
          until:
            - recovery_final_primary_role.rc | default(1) == 0
            - (recovery_final_primary_role.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Primary\\s*$')
            - (recovery_final_primary_role.stdout | default('')) is search('(?im)^\\s*Node State\\s*:\\s*UP\\s*$')
          retries: >-
            {{ ((ha_transition_timeout | int) / (ha_poll_interval | int)) | round(0, 'ceil') | int }}
          delay: "{{ ha_poll_interval }}"
          changed_when: false
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true
          when:
            - ha_versions_match | default(false) | bool
            - (recovery_roles_original | default(false) | bool) or (recovery_roles_inverted | default(false) | bool)

        - name: Confirm original Secondary role after recovery failback
          ansible.builtin.raw: ssh_netscaler_adc show ha node 0
          delegate_to: "{{ secondary_host }}"
          register: recovery_final_secondary_role
          until:
            - recovery_final_secondary_role.rc | default(1) == 0
            - (recovery_final_secondary_role.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Secondary\\s*$')
            - (recovery_final_secondary_role.stdout | default('')) is search('(?im)^\\s*Node State\\s*:\\s*UP\\s*$')
          retries: >-
            {{ ((ha_transition_timeout | int) / (ha_poll_interval | int)) | round(0, 'ceil') | int }}
          delay: "{{ ha_poll_interval }}"
          changed_when: false
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true
          when:
            - ha_versions_match | default(false) | bool
            - (recovery_roles_original | default(false) | bool) or (recovery_roles_inverted | default(false) | bool)

        - name: Permit HA restoration only with matching versions and original roles
          ansible.builtin.set_fact:
            ha_restore_safe: >-
              {{ ha_versions_match | default(false) | bool
                 and (recovery_final_primary_role.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Primary\\s*$')
                 and (recovery_final_secondary_role.stdout | default('')) is search('(?im)^\\s*Master State\\s*:\\s*Secondary\\s*$') }}
          when: ha_controls_change_started | default(false) | bool

        - name: Keep matching-version nodes isolated when original roles are not confirmed
          ansible.builtin.set_fact:
            pair_status: MANUAL_RECOVERY_REQUIRED
            pair_manual_recovery: true
            pair_error: >-
              {{ (pair_error ~ '; ' if pair_error | length else '') ~
                 'Both nodes have the same version, but the original Primary/Secondary roles could not be confirmed. HA isolation was retained.' }}
          when:
            - ha_versions_match | default(false) | bool
            - not (ha_restore_safe | default(false) | bool)

        - name: Restore HA synchronization and command propagation when versions match
          ansible.builtin.raw: >-
            ssh_netscaler_adc set ha node -hasync ENABLED -haprop ENABLED
          delegate_to: "{{ item }}"
          loop:
            - "{{ primary_host }}"
            - "{{ secondary_host }}"
          loop_control:
            label: "{{ hostvars[item].netscaler_hostname | default(item) }} ({{ hostvars[item].nsip }})"
          register: ha_restore_commands
          when:
            - ha_controls_change_started | default(false) | bool
            - ha_restore_safe | default(false) | bool
          until:
            - not (ha_restore_commands.unreachable | default(false))
            - ha_restore_commands.rc | default(1) == 0
          retries: >-
            {{ ((recovery_probe_timeout | int) / (ha_poll_interval | int)) | round(0, 'ceil') | int }}
          delay: "{{ ha_poll_interval }}"
          changed_when: true
          ignore_errors: true
          ignore_unreachable: true

        - name: Save restored HA controls
          ansible.builtin.raw: >-
            ssh_netscaler_adc save ns config
          delegate_to: "{{ item }}"
          loop:
            - "{{ primary_host }}"
            - "{{ secondary_host }}"
          loop_control:
            label: "{{ hostvars[item].netscaler_hostname | default(item) }} ({{ hostvars[item].nsip }})"
          register: ha_restore_save_commands
          when:
            - ha_controls_change_started | default(false) | bool
            - ha_restore_safe | default(false) | bool
          changed_when: >-
            ha_restore_save_commands.rc == 0
            and 'running configuration has not changed' not in
                (ha_restore_save_commands.stdout | default('') | lower)
          failed_when:
            - ha_restore_save_commands.rc != 0
            - "'running configuration has not changed' not in (ha_restore_save_commands.stdout | default('') | lower)"
          until: >-
            ha_restore_save_commands.rc | default(1) == 0
            or 'running configuration has not changed' in
               (ha_restore_save_commands.stdout | default('') | lower)
          retries: >-
            {{ ((recovery_probe_timeout | int) / (ha_poll_interval | int)) | round(0, 'ceil') | int }}
          delay: "{{ ha_poll_interval }}"
          ignore_errors: true
          ignore_unreachable: true

        - name: Read restored local HA controls
          ansible.builtin.raw: >-
            ssh_netscaler_adc show ha node 0
          delegate_to: "{{ item }}"
          loop:
            - "{{ primary_host }}"
            - "{{ secondary_host }}"
          loop_control:
            label: "{{ hostvars[item].netscaler_hostname | default(item) }} ({{ hostvars[item].nsip }})"
          register: ha_restored_local_controls
          when:
            - ha_controls_change_started | default(false) | bool
            - ha_restore_safe | default(false) | bool
          until:
            - not (ha_restored_local_controls.unreachable | default(false))
            - ha_restored_local_controls.rc | default(1) == 0
            - (ha_restored_local_controls.stdout | default('')) is search('(?im)^\\s*Propagation\\s*:\\s*ENABLED\\s*$')
          retries: >-
            {{ ((recovery_probe_timeout | int) / (ha_poll_interval | int)) | round(0, 'ceil') | int }}
          delay: "{{ ha_poll_interval }}"
          changed_when: false
          ignore_errors: true
          ignore_unreachable: true

        - name: Verify restored HA controls
          ansible.builtin.assert:
            that:
              - (item.stdout | default('')) is search('(?im)^\\s*Sync State\\s*:\\s*(ENABLED|SUCCESS)\\s*$')
              - (item.stdout | default('')) is search('(?im)^\\s*Propagation\\s*:\\s*ENABLED\\s*$')
            fail_msg: >-
              haSync or haProp was not confirmed ENABLED on
              {{ hostvars[item.item].netscaler_hostname | default(item.item) }}
              ({{ hostvars[item.item].nsip }}).
          loop: "{{ ha_restored_local_controls.results | default([]) }}"
          loop_control:
            label: "{{ hostvars[item.item].netscaler_hostname | default(item.item) }} ({{ hostvars[item.item].nsip }})"
          register: ha_restore_verification
          when:
            - ha_controls_change_started | default(false) | bool
            - ha_restore_safe | default(false) | bool
          ignore_errors: true

        - name: Record HA controls restoration state
          ansible.builtin.set_fact:
            ha_controls_restored: >-
              {{
                not (ha_restore_commands.failed | default(false))
                and not (ha_restore_commands.unreachable | default(false))
                and not (ha_restore_save_commands.failed | default(false))
                and not (ha_restore_save_commands.unreachable | default(false))
                and not (ha_restored_local_controls.failed | default(false))
                and not (ha_restored_local_controls.unreachable | default(false))
                and not (ha_restore_verification.failed | default(false))
                and (ha_restored_local_controls.results | default([]) | length == 2)
              }}
          when:
            - ha_controls_change_started | default(false) | bool
            - ha_restore_safe | default(false) | bool

        - name: Require manual recovery when matching-version HA controls could not be restored
          ansible.builtin.set_fact:
            pair_status: MANUAL_RECOVERY_REQUIRED
            pair_manual_recovery: true
            pair_error: >-
              {{ (pair_error ~ '; ' if pair_error | length else '') ~
                 'HA synchronization or command propagation could not be re-enabled on both nodes. Manual recovery is required.' }}
          when:
            - ha_controls_change_started | default(false) | bool
            - ha_restore_safe | default(false) | bool
            - not (ha_controls_restored | default(false) | bool)

        - name: Force final HA synchronization from restored original Primary
          ansible.builtin.raw: >-
            ssh_netscaler_adc force ha sync
          delegate_to: "{{ primary_host }}"
          register: final_ha_sync
          when:
            - pair_status == 'SUCCESS'
            - ha_controls_restored | default(false) | bool
          changed_when: true
          ignore_errors: true
          ignore_unreachable: true

        - name: Mark pair failed when final HA synchronization failed
          ansible.builtin.set_fact:
            pair_status: FAILED
            pair_error: >-
              Final forced HA synchronization failed after haSync and haProp were
              re-enabled. Inspect both nodes before retrying.
          when:
            - final_ha_sync is defined
            - final_ha_sync.failed | default(false)

        - name: Display restored HA controls
          ansible.builtin.debug:
            msg: >-
              HA synchronization and command propagation were re-enabled and saved
              on both nodes{{ '; final forced synchronization completed' if pair_status == 'SUCCESS' else '' }}.
          when: ha_controls_restored | default(false) | bool

        - name: Build pair report record
          ansible.builtin.set_fact:
            pair_result:
              pair: "{{ pair_name }}"
              status: "{{ pair_status }}"
              original_primary: "{{ primary_nsip }}"
              original_secondary: "{{ secondary_nsip }}"
              target_version: "{{ netscaler_target_version }}"
              primary_before: "{{ pair_versions.get('primary', {}).get('before', 'unknown') }}"
              primary_after: "{{ pair_versions.get('primary', {}).get('after', 'unknown') }}"
              secondary_before: "{{ pair_versions.get('secondary', {}).get('before', 'unknown') }}"
              secondary_after: "{{ pair_versions.get('secondary', {}).get('after', 'unknown') }}"
              started_at: "{{ pair_started_at }}"
              ended_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
              duration_seconds: "{{ (lookup('pipe', 'date -u +%s') | int) - (pair_started_epoch | int) }}"
              error: "{{ pair_error }}"

        - name: Display pair completion
          ansible.builtin.debug:
            msg: >-
              {{ pair_status }} | {{ pair_name }} | Primary
              {{ pair_result.primary_before }} -> {{ pair_result.primary_after }};
              Secondary {{ pair_result.secondary_before }} -> {{ pair_result.secondary_after }};
              duration {{ pair_result.duration_seconds }} seconds.

- name: Write final reports and validate the complete run
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - variables.yaml
    - "{{ lookup('ansible.builtin.first_found', {'files': ['prepared_firmware.yml', 'prepared_firmware.yml.example'], 'paths': [playbook_dir]}) }}"
  tasks:
    - name: Initialize aggregate results
      ansible.builtin.set_fact:
        upgrade_results: []

    - name: Collect every pair result
      ansible.builtin.set_fact:
        upgrade_results: >-
          {{ upgrade_results + [hostvars[item].pair_result
             | default({'pair': hostvars[item].pair_name | default(item),
                        'status': 'MANUAL_RECOVERY_REQUIRED',
                        'original_primary': hostvars[item].primary_nsip | default('unknown'),
                        'original_secondary': hostvars[item].secondary_nsip | default('unknown'),
                        'target_version': netscaler_target_version,
                        'primary_before': 'unknown',
                        'primary_after': 'unknown',
                        'secondary_before': 'unknown',
                        'secondary_after': 'unknown',
                        'started_at': upgrade_run_started,
                        'ended_at': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ'),
                        'duration_seconds': 0,
                        'error': 'The pair stopped before returning a completion record. Inspect both nodes; HA isolation may still be active.'})] }}
      loop: "{{ groups['netscaler_ha_pairs'] }}"

    - name: Calculate final counts
      ansible.builtin.set_fact:
        successful_pairs: "{{ upgrade_results | selectattr('status', 'equalto', 'SUCCESS') | list }}"
        manual_recovery_pairs: "{{ upgrade_results | selectattr('status', 'equalto', 'MANUAL_RECOVERY_REQUIRED') | list }}"
        failed_pairs: "{{ upgrade_results | rejectattr('status', 'equalto', 'SUCCESS') | list }}"
        upgrade_run_ended: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
        upgrade_run_duration: >-
          {{ (lookup('pipe', 'date -u +%s') | int) - (upgrade_run_started_epoch | int) }}

    - name: Write JSON upgrade report
      ansible.builtin.copy:
        dest: "{{ report_directory }}/upgrade-{{ upgrade_run_id }}.json"
        mode: "0600"
        content: >-
          {{ {'run_id': upgrade_run_id,
              'started_at': upgrade_run_started,
              'ended_at': upgrade_run_ended,
              'duration_seconds': upgrade_run_duration | int,
              'target_version': netscaler_target_version,
              'firmware': prepared_firmware_file_name,
              'firmware_sha256': prepared_firmware_sha256,
              'parallel_pairs': ha_pairs_parallel | int,
              'successful_pairs': successful_pairs | length,
              'manual_recovery_pairs': manual_recovery_pairs | length,
              'failed_pairs': failed_pairs | length,
              'results': upgrade_results} | to_nice_json }}

    - name: Write Markdown upgrade report
      ansible.builtin.template:
        src: templates/upgrade_report.md.j2
        dest: "{{ report_directory }}/upgrade-{{ upgrade_run_id }}.md"
        mode: "0600"

    - name: Display final run result
      ansible.builtin.debug:
        msg: >-
          Upgrade finished: {{ successful_pairs | length }}/{{ upgrade_results | length }} pairs succeeded,
          {{ failed_pairs | length }} failed. Reports:
          {{ report_directory }}/upgrade-{{ upgrade_run_id }}.json and
          {{ report_directory }}/upgrade-{{ upgrade_run_id }}.md

    - name: Return a failing exit code if any pair did not complete correctly
      ansible.builtin.assert:
        that:
          - failed_pairs | length == 0
        success_msg: "SUCCESS: every HA pair passed final version and role validation."
